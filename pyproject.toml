[project]
name = "gw2mcp"
version = "0.1.0"
description = "MCP server for the Guild Wars 2 API with historical account tracking"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["mcp", "guild-wars-2", "gw2", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
gw2mcp = "gw2mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gw2mcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: runs against the real GW2 API (only when GW2_API_KEY is set)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "E731", "SIM105"]

[tool.coverage.run]
source = ["gw2mcp"]
